[project]
name = "strings-lint"
version = "0.1.0"
description = "Lint app localization files: placeholders, plural forms, empty strings and App Store / Google Play limits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["babel>=2.14"]
keywords = ["localization", "i18n", "l10n", "xcstrings", "android", "flutter", "arb", "i18next", "fastlane", "lint"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Internationalization",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/lowest-digital/strings-lint"
Issues = "https://github.com/lowest-digital/strings-lint/issues"

[project.scripts]
strings-lint = "strings_lint.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strings_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
